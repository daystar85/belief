<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 가치관 정원</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#ffe9f1;--bg2:#e6efff;--bg3:#fff6df;--ink:#4a3f4f;--sub:#85788d;--card:rgba(255,255,255,.78);--sh:0 10px 30px rgba(150,120,170,.22)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2038;--bg2:#1c2742;--bg3:#2f2a3a;--ink:#f3e9f6;--sub:#bcaec8;--card:rgba(62,50,84,.72);--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#2b2038;--bg2:#1c2742;--bg3:#2f2a3a;--ink:#f3e9f6;--sub:#bcaec8;--card:rgba(62,50,84,.72);--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink)}
body::before,body::after{content:'';position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;background:#ffc4da;left:-20vmax;top:-18vmax}
body::after{background:#c3d8ff;left:auto;right:-22vmax;top:auto;bottom:-22vmax}
.scene{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .9s,transform 1s cubic-bezier(.6,.05,.2,1)}
.scene.on{opacity:1;pointer-events:auto}
button{font:inherit;cursor:pointer}
.face{display:block;width:100%}
.face .s{display:none}
.happy .face .n{display:none}
.happy .face .s{display:inline}
.pair{display:flex;align-items:flex-end;justify-content:center}
.who{width:50%;margin:0 -2%}
.happy .who{animation:hop .55s ease 3}
.happy .who:nth-child(2){animation-delay:.12s}
@keyframes hop{40%{transform:translateY(-14px) rotate(-3deg)}}
/* gate */
#gate.out{transform:scale(2.4);opacity:0;pointer-events:none}
#gate h1{font-size:clamp(25px,7vw,34px);font-weight:400;margin:0 0 6px}
#gate .sub{margin:0 0 26px;color:var(--sub);font-size:14px}
.door{width:min(78vw,330px);aspect-ratio:1/.98;border:0;padding:12px;border-radius:999px 999px 30px 30px;background:linear-gradient(#ffcfe0,#cddfff);box-shadow:var(--sh),0 0 0 8px rgba(255,255,255,.45);transition:transform .4s}
.door:hover{transform:translateY(-4px)}
.arch{height:100%;border-radius:999px 999px 20px 20px;background:linear-gradient(#fffdf6,#ffeef5);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.arch .pair{width:100%;padding:0 6%}
.hint{margin-top:26px;color:var(--sub);font-size:13px;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.heart{position:fixed;pointer-events:none;font-size:22px;animation:up 1.7s ease-out forwards}
@keyframes up{to{transform:translateY(-140px) scale(1.5);opacity:0}}
/* pin pad */
.pad{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;background:rgba(190,160,220,.28);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.pad.on{opacity:1;pointer-events:auto}
.sheet{width:min(100%,380px);margin:0 auto;background:var(--card);backdrop-filter:blur(24px);border-radius:32px 32px 0 0;padding:26px 28px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pad.on .sheet{transform:none}
.sheet.sk{animation:sk .45s}
@keyframes sk{25%{translate:-9px}75%{translate:9px}}
#pm{margin:0 0 16px;font-size:15px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #e59ab5;transition:.2s}
.dots i.f{background:#e59ab5;transform:scale(1.15)}
.keys{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:12px}
.keys button{height:64px;border:0;border-radius:50%;font-size:22px;color:var(--ink);background:rgba(255,255,255,.6);box-shadow:0 3px 10px rgba(150,120,170,.15)}
.keys button:active{background:#ffd6e4}
/* stage */
#stage{transform:scale(.75)}
#stage.on{transform:none}
#stage.on.dive{transform:scale(2.6);opacity:0;pointer-events:none}
#stage h2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);margin:0;font-size:16px;font-weight:400;color:var(--sub);letter-spacing:.06em}
.orbit{position:relative;width:min(100vw,540px);height:min(calc(100svh - 110px),720px)}
.orbit>.pair{position:absolute;left:50%;top:50%;width:46%;translate:-50% -50%}
.b{position:absolute;isolation:isolate;width:clamp(106px,29%,150px);padding:26px 8px 18px;text-align:center;border:0;color:#4a3f4f;background:radial-gradient(circle at 30% 25%,#fff,var(--cl));border-radius:58% 42% 54% 46%/52% 56% 44% 48%;box-shadow:var(--sh),inset 0 -6px 14px rgba(255,255,255,.6);animation:fl 5s ease-in-out infinite var(--d)}
.b::before,.b::after{content:'';position:absolute;z-index:-1;border-radius:50%;background:var(--cl);width:36%;aspect-ratio:1;top:-14%;left:14%}
.b::after{width:30%;left:auto;right:16%;top:-10%}
.b.empty{filter:grayscale(1);opacity:.5}
.b em{display:block;font-style:normal;font-size:22px}
.b b{display:block;font-size:17px;font-weight:400}
.b small{display:block;font-size:11px;opacity:.7}
@keyframes fl{50%{transform:translateY(-9px)}}
#stage .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);margin:0}
/* detail */
#detail{justify-content:flex-start;overflow-y:auto;transform:scale(.7)}
#detail.on{transform:none}
.dw{width:min(100%,520px);padding:18px 18px 44px;margin:0 auto}
.back{border:0;background:var(--card);color:var(--ink);padding:9px 16px;border-radius:20px;box-shadow:var(--sh)}
.dh{text-align:center;margin:10px 0 6px}
.dh span{font-size:38px}
.dh h2{margin:2px 0;font-size:26px;font-weight:400}
.dh p{margin:0;color:var(--sub);font-size:14px}
.meter{margin:20px 4px;text-align:center;font-size:12.5px;color:var(--sub)}
.bar{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,#b8ecd6,#ffe3a8,#ffb3c1);margin:10px 0 8px}
.bar i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--sh);translate:-50% -50%}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card,.tip{background:var(--card);backdrop-filter:blur(12px);border-radius:26px;padding:16px 12px;text-align:center;box-shadow:var(--sh)}
.av{width:76px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(#fffdf6,#ffe6ef);overflow:hidden;padding-top:6px}
.card h3{margin:4px 0;font-size:13px;color:var(--sub);font-weight:400}
.card strong{display:block;font-size:15px;font-weight:400;margin:6px 0}
.card p,.tip p{font-size:12.5px;line-height:1.7;margin:0;color:var(--sub)}
.tip{margin-top:16px;padding:18px}
.tip b{display:block;font-weight:400;margin-bottom:6px;font-size:15px}
.tip p{font-size:13.5px;color:var(--ink)}
.an{margin-top:16px;padding:18px;background:var(--card);backdrop-filter:blur(12px);border-radius:26px;box-shadow:var(--sh);text-align:left}
.an>b{display:block;font-weight:400;font-size:15px;margin-bottom:4px;text-align:center}
.an dl{margin:0}
.an dt{display:inline-block;padding:2px 10px;border-radius:12px;background:#ffe3ee;color:#4a3f4f;font-size:12px;margin:14px 0 5px}
.an dt.dd2{background:#dfe9ff}
.an dt.dd3{background:#d8f5e6}
.an dd{margin:0;font-size:13.5px;line-height:1.8;color:var(--ink)}
.an .anf{margin:14px 0 0;font-size:11px;color:var(--sub);text-align:center;line-height:1.6}
.an .anx{margin-top:8px;font-size:11.5px;line-height:1.75}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

.tabs{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--sh)}
.tabs button{border:0;background:none;color:var(--sub);padding:8px 20px;border-radius:22px;transition:.3s}
.tabs button.on{background:linear-gradient(#ffd6e4,#e3d9ff);color:#4a3f4f}
.b{animation:fl 5s ease-in-out infinite var(--d),in .6s ease both}
@keyframes in{from{opacity:0;scale:.7}}
.sc{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0 0}
.sc i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:10px;background:#ffe3ee;color:#4a3f4f}
.shot{width:100%;display:block;border-radius:14px;margin-top:12px;cursor:zoom-in;box-shadow:var(--sh)}
.note{font-size:11.5px;color:var(--sub);text-align:center;margin:16px 6px 0;line-height:1.75}
#lb{position:fixed;inset:0;z-index:9;background:rgba(40,30,50,.88);display:none;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:94svh;border-radius:12px}

.tabs button{padding:8px 14px}
.rank{background:var(--card);backdrop-filter:blur(12px);border-radius:26px;padding:16px;box-shadow:var(--sh);margin-top:14px}
.rw{margin:12px 0}
.rw b{display:block;font-weight:400;font-size:13px;margin-bottom:3px}
.rank span{display:block;height:22px;line-height:22px;border-radius:11px;padding:0 10px;font-size:11.5px;color:#4a3f4f;margin:3px 0;min-width:34px}
.bh{background:#bcd4ff}.bw{background:#ffc3d6}
.rank .lg{display:flex;gap:8px;justify-content:center}
.lg span{display:inline-block;height:auto;line-height:1.7;padding:0 14px}
.mb{height:6px;border-radius:4px;background:rgba(150,120,170,.18);margin:10px 6px 0}
.mb i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffc3d6,#bcd4ff)}
.tip p+p{margin-top:9px}
.tabs button{padding:8px 9px;font-size:13px}
.tabs{max-width:96vw;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 7px;font-size:12.5px;white-space:nowrap}
.subtabs{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 66px);display:none;gap:4px;padding:4px;border-radius:26px;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--sh)}
.subtabs.on{display:flex}
.subtabs button{border:0;background:none;color:var(--sub);padding:7px 12px;border-radius:22px;font-size:12.5px;white-space:nowrap;transition:.3s}
.subtabs button.on{background:linear-gradient(#ffd6e4,#e3d9ff);color:#4a3f4f}
.sp-wrap{position:absolute;left:50%;top:50%;width:46%;translate:-50% -50%}
.sp-wrap .pair{position:relative;width:100%}
.lday{position:absolute;left:50%;bottom:100%;translate:-50% 0;margin-bottom:6px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.lday svg{width:22px;height:20px;flex:none;filter:drop-shadow(0 0 2px #d6779b) drop-shadow(0 0 4px rgba(214,119,155,.7))}
.lday span{font-size:20px;color:#fff;letter-spacing:.06em;text-shadow:0 0 2px #d6779b,0 0 5px #d6779b,0 0 9px rgba(214,119,155,.8)}
#film{position:absolute;z-index:2;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:env(safe-area-inset-bottom,0px);overflow-y:auto;display:none;padding:4px 14px 90px;scroll-behavior:smooth}
#film.on{display:block}
.fhd{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 14px;animation:pl 2.4s ease-in-out infinite}
.strip{position:relative;width:min(100%,420px);margin:0 auto;background:linear-gradient(#2b2530,#352d3b);border-radius:16px;padding:34px 38px 14px;box-shadow:var(--sh)}
.strip::before,.strip::after{content:'';position:absolute;top:14px;bottom:14px;width:14px;background:repeating-linear-gradient(to bottom,#f6eef8 0 11px,transparent 11px 24px);opacity:.6;border-radius:3px}
.strip::before{left:12px}.strip::after{right:12px}
.film{margin:0 0 30px;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .9s ease,transform .9s ease}
.film.in{opacity:1;transform:none}
.fn{display:flex;justify-content:space-between;font-size:10.5px;color:#ff9b6a;font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;margin:0 2px 6px}
.frame{background:#fffdf6;border-radius:5px;overflow:hidden;margin:0 0 8px;box-shadow:0 0 0 3px #1e1a22}
.frame svg{display:block;width:100%;height:auto}
.fl{font-size:12px;color:#e9dff0;margin:2px 0 14px;text-align:center}
.fcap{color:#f3e9f6;margin-top:8px}
.fcap b{display:block;font-weight:400;font-size:15px;color:#ffc3d6}
.fcap p{margin:6px 0 0;font-size:13px;line-height:1.75;color:#e9dff0}
.fend{text-align:center;color:var(--sub);font-size:12px;margin:14px 0 0}

/* 필름 부드러운 등장 */
#film.on .strip{animation:filmSlideIn .7s cubic-bezier(.16,1,.3,1) both}
@keyframes filmSlideIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}

/* 찰칵 플래시 효과 */
#cam-flash{position:fixed;inset:0;z-index:99;background:#fff;opacity:0;pointer-events:none}
#cam-flash.pop{animation:flashPop .5s ease-out forwards}
@keyframes flashPop{0%{opacity:.92}40%{opacity:.6}100%{opacity:0}}

/* 남자가 여자 사진 찍는 애니메이션 오버레이 */
#cam-overlay{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(22,16,30,.88);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s ease}
#cam-overlay.on{opacity:1}
.cam-shoot-card{position:relative;width:min(88vw,330px);background:linear-gradient(170deg,rgba(255,255,255,.95),rgba(255,242,248,.92));border-radius:28px;padding:24px 20px 20px;box-shadow:0 16px 40px rgba(40,20,50,.35),0 0 0 1px rgba(255,255,255,.6);text-align:center;transform:scale(.92);transition:transform .4s cubic-bezier(.16,1,.3,1)}
#cam-overlay.on .cam-shoot-card{transform:scale(1)}
.cam-shoot-stage{position:relative;width:100%;height:140px;display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-bottom:8px}
.cam-shoot-who{width:45%;max-width:115px;position:relative}
.cam-shoot-who svg{display:block;width:100%;height:auto}
.cam-shoot-he{transform-origin:bottom center;animation:heAim 1.2s ease-in-out infinite alternate}
@keyframes heAim{0%{transform:rotate(0deg)}100%{transform:rotate(3deg) translateY(-2px)}}
.cam-shoot-she{transform-origin:bottom center;animation:shePose 1.1s ease-in-out infinite alternate}
@keyframes shePose{0%{transform:rotate(0deg) scale(1)}100%{transform:rotate(-3deg) scale(1.03) translateY(-4px)}}
.cam-heart-burst{position:absolute;top:10px;left:50%;translate:-50% 0;display:flex;gap:6px;font-size:16px;animation:burstFloat 1.2s ease-in-out infinite alternate}
@keyframes burstFloat{0%{transform:translate(-50%,0) scale(.95);opacity:.75}100%{transform:translate(-50%,-8px) scale(1.15);opacity:1}}
.cam-shutter-label{font-size:15px;font-weight:700;color:#e57b9f;letter-spacing:.04em;margin-top:4px}
.cam-sub-label{font-size:12px;color:var(--sub);margin-top:2px}

/* ===== 정통 사주명리 심층 감정서 & 궁합 전용 뷰 UI ===== */
#saju-all{position:absolute;z-index:2;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:env(safe-area-inset-bottom,0px);overflow-y:auto;display:none;padding:6px 14px 90px}
#saju-all.on{display:block}
.sj-wrap{width:min(100%,720px);margin:0 auto;text-align:left;word-break:keep-all;overflow-wrap:break-word;animation:filmSlideIn .55s cubic-bezier(.16,1,.3,1) both}
.sj-hero{position:relative;background:linear-gradient(145deg,#2d2240 0%,#433260 55%,#523b68 100%);color:#fff;padding:24px 20px 20px;border-radius:28px;box-shadow:var(--sh);border-bottom:4px solid #f5b95f;margin-bottom:14px;overflow:hidden}
.sj-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sj-badge{display:inline-block;background:rgba(245,158,11,.24);border:1px solid #fbbf24;color:#fde68a;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.03em}
.sj-avs{display:flex;align-items:center;gap:6px}
.sj-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(#fffdf6,#ffe6ef);overflow:hidden;padding-top:3px;box-shadow:0 3px 10px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.7)}
.sj-av-heart{font-size:14px;filter:drop-shadow(0 0 4px #ff9bb5)}
.sj-hero h3{font-size:clamp(18px,4.5vw,23px);font-weight:700;margin:0 0 6px;color:#fff;line-height:1.4}
.sj-hero .sj-sub{color:#e6dcf5;font-size:13px;margin:0 0 16px;line-height:1.6}
.sj-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;background:rgba(255,255,255,.09);padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.16)}
.sj-meta-item{display:flex;flex-direction:column}
.sj-meta-label{font-size:11px;color:#d1c4e9;margin-bottom:2px}
.sj-meta-val{font-size:12.8px;font-weight:700;color:#fff}

/* 3대 파트 전환 탭바 (Sticky) */
.sj-tabs{position:sticky;top:4px;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;background:var(--card);backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid rgba(255,255,255,.5)}
.sj-tabs button{border:0;background:rgba(255,255,255,.55);color:var(--sub);padding:9px 3px;border-radius:16px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.25s;white-space:nowrap}
.sj-tabs button span{font-size:10.5px;font-weight:400;opacity:.85}
.sj-tabs button.on{background:linear-gradient(135deg,#ffd6e4,#e3d9ff);color:#4a3f4f;box-shadow:0 4px 12px rgba(180,140,200,.28);transform:translateY(-1px)}

/* 파트 컨테이너 & 섹션 퀵칩 */
.sj-part{display:none;animation:sjFade .38s ease both}
.sj-part.on{display:block}
@keyframes sjFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sj-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sj-chips button{border:1px solid rgba(150,120,170,.24);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:12px;box-shadow:0 3px 10px rgba(150,120,170,.1);transition:.2s}
.sj-chips button:hover,.sj-chips button:active{background:linear-gradient(90deg,#ffd6e4,#e3d9ff);color:#4a3f4f}

.sj-part-banner{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:24px;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--sh);margin:8px 0 12px;border-left:6px solid #e59ab5}
.sj-part-banner.p1{border-left-color:#60a5fa}
.sj-part-banner.p2{border-left-color:#f472b6}
.sj-part-banner.p3{border-left-color:#f59e0b}
.sj-part-banner.p4{border-left-color:#a855f7}
.sj-part-banner.p5{border-left-color:#10b981}
.sj-part-av{width:52px;height:52px;flex:none;border-radius:50%;background:linear-gradient(#fffdf6,#ffe6ef);overflow:hidden;padding-top:4px;box-shadow:var(--sh)}
.sj-part-av.pair{width:72px;border-radius:26px;display:flex;align-items:flex-end;justify-content:center;padding:4px 2px 0}
.sj-part-av.pair .face{width:54%;margin:0 -4%}
.sj-part-info{flex:1;min-width:0}
.sj-part-num{display:inline-block;background:linear-gradient(135deg,#ffd6e4,#e3d9ff);color:#4a3f4f;font-weight:700;font-size:11.5px;padding:2px 10px;border-radius:999px;margin-bottom:4px}
.sj-part-title{font-size:clamp(15.5px,4vw,18px);font-weight:700;color:var(--ink);margin:0;line-height:1.35}
.sj-part-meta{font-size:12px;color:var(--sub);margin-top:3px}

.sj-sec{background:var(--card);backdrop-filter:blur(12px);border-radius:26px;padding:20px 18px;box-shadow:var(--sh);margin-top:14px;text-align:left;line-height:1.8;word-break:keep-all;scroll-margin-top:74px}
.sj-sec h3.sub-title{font-size:16.5px;font-weight:700;color:var(--ink);margin:0 0 14px;padding-left:11px;border-left:4px solid #e59ab5;line-height:1.45}
.sj-sec p{margin:0 0 10px;font-size:13.8px;color:var(--ink);line-height:1.8}
.sj-sec ul,.sj-sec ol{margin:6px 0 12px 19px;padding:0;font-size:13.6px;color:var(--ink);line-height:1.8}
.sj-sec li{margin-bottom:7px}
.sj-sec li:last-child{margin-bottom:0}
.sj-sec code{background:rgba(150,120,170,.16);padding:1px 6px;border-radius:6px;font-size:12.5px;font-family:inherit}

/* 사주 4기둥 & 상세 그리드 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.pillar{background:rgba(255,255,255,.68);border:1.5px solid rgba(150,120,170,.22);border-radius:18px;padding:9px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pillar.me{border-color:#e59ab5;box-shadow:0 0 0 2.5px rgba(229,154,181,.38);background:rgba(255,240,246,.75)}
.pillar-label{font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;line-height:1.25}
.pillar-label small{display:block;font-size:10.5px;color:#e57b9f;font-weight:700}
.hanja-box{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:9px 3px;border-radius:12px;font-weight:700;text-align:center}
.hanja-char{font-size:26px;line-height:1.15;margin-bottom:3px}
.hanja-desc{font-size:11px;font-weight:600;line-height:1.25}
.el-wood{background:#dcfce7;color:#166534;border:1px solid #86efac}
.el-fire{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.el-earth{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.el-metal{background:#f8fafc;color:#334155;border:1px solid #cbd5e1}
.el-water{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.detail-card{border:1px solid rgba(150,120,170,.24);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.68)}
.detail-title{background:linear-gradient(90deg,#ffd6e4,#e3d9ff);color:#4a3f4f;font-weight:700;font-size:13px;padding:7px 12px}
.dl-row{display:flex;gap:8px;padding:6px 12px;border-top:1px solid rgba(150,120,170,.16);font-size:12.8px;line-height:1.5}
.dl-row:first-of-type{border-top:none}
.dl-row .dt{flex:0 0 88px;color:var(--sub);font-weight:700;font-size:12px}
.dl-row .dd{flex:1;color:var(--ink)}

/* 오행 분포 배지 & 시각 게이지 */
.ohang-summary{display:flex;flex-wrap:wrap;gap:7px;background:rgba(255,255,255,.65);padding:13px 14px;border-radius:18px;border:1px solid rgba(150,120,170,.22);margin:10px 0;align-items:center;font-size:13px;color:var(--ink)}
.ohang-badge{padding:4px 10px;border-radius:9px;font-size:12.5px;font-weight:700}
.ohang-bars{width:100%;display:flex;height:24px;border-radius:12px;overflow:hidden;gap:3px;margin-top:6px;background:rgba(150,120,170,.14);padding:3px}
.ohang-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:8px;white-space:nowrap}
.ohang-seg.w{background:#bbf7d0;color:#166534}
.ohang-seg.f{background:#fecaca;color:#991b1b}
.ohang-seg.e{background:#fef08a;color:#854d0e}
.ohang-seg.m{background:#e2e8f0;color:#1e293b}
.ohang-extra{width:100%;font-size:12.5px;color:var(--sub);margin-top:4px}

/* 강조/경고/시너지 콜아웃 카드 & 비교 카드 & 타임라인 */
.card-box{background:rgba(255,255,255,.68);border:1px solid rgba(150,120,170,.24);border-left:5px solid #94a3b8;border-radius:18px;padding:15px 16px;margin:12px 0;color:var(--ink)}
.card-box.highlight{border-color:rgba(245,158,11,.45);border-left-color:#f59e0b}
.card-box.alert{border-color:rgba(239,68,68,.42);border-left-color:#ef4444}
.card-box.synergy{border-color:rgba(34,197,94,.42);border-left-color:#22c55e}
.card-title{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.card-box.highlight .card-title{color:#d97706}
.card-box.alert .card-title{color:#e11d48}
.card-box.synergy .card-title{color:#15803d}
.comp-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 16px}
.comp-card{border:1px solid rgba(150,120,170,.25);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.7)}
.comp-head{background:linear-gradient(90deg,#ffd6e4,#e3d9ff);color:#4a3f4f;padding:8px 14px;font-size:14px;font-weight:700}
.comp-line{display:flex;gap:10px;padding:9px 14px;border-top:1px solid rgba(150,120,170,.16);font-size:13px;line-height:1.65;color:var(--ink)}
.comp-line .who{flex:0 0 38px;font-weight:700;font-size:12px;margin:0;width:auto}
.comp-line.m .who{color:#0284c7}
.comp-line.f .who{color:#db2777}
.comp-line.x{background:rgba(245,158,11,.12);color:var(--ink)}
.comp-line.x .who{color:#d97706}
.timeline{border-left:3px solid #e59ab5;margin:14px 0 6px 10px;padding-left:18px}
.timeline-item{position:relative;margin-bottom:18px}
.timeline-item:last-child{margin-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-25px;top:6px;width:11px;height:11px;border-radius:50%;background:#e59ab5;border:2px solid #fff;box-shadow:0 0 0 2px #e59ab5}
.timeline-period{font-weight:700;color:#d66892;font-size:14.5px;margin-bottom:4px}
.sj-part-nav{display:flex;gap:8px;margin-top:16px}
.sj-part-nav button{flex:1;border:0;background:linear-gradient(135deg,#ffd6e4,#e3d9ff);color:#4a3f4f;padding:13px 14px;border-radius:20px;box-shadow:var(--sh);font-size:13.5px;font-weight:700;transition:.2s}
.sj-part-nav button.sub{background:var(--card);color:var(--ink);flex:0 0 auto;padding:13px 16px}
.sj-part-nav button:active{transform:scale(.98)}
.sj-footer{background:var(--card);border-radius:20px;padding:16px 18px;text-align:center;color:var(--sub);font-size:12.5px;margin-top:16px;box-shadow:var(--sh);line-height:1.6}
@media(max-width:580px){.detail-grid,.comp-list{grid-template-columns:1fr}.sj-sec{padding:16px 14px}.sj-tabs button span{display:none}}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .pillar,:root:not([data-theme="light"]) .detail-card,:root:not([data-theme="light"]) .ohang-summary,:root:not([data-theme="light"]) .card-box,:root:not([data-theme="light"]) .comp-card,:root:not([data-theme="light"]) .sj-tabs button:not(.on){background:rgba(45,36,64,.78)}

  :root:not([data-theme="light"]) .card-box.synergy .card-title{color:#4ade80}
  :root:not([data-theme="light"]) .comp-line.m .who{color:#38bdf8}
  :root:not([data-theme="light"]) .comp-line.f .who{color:#f472b6}
  :root:not([data-theme="light"]) .timeline-period{color:#f9a8d4}
}
:root[data-theme="dark"] .pillar,:root[data-theme="dark"] .detail-card,:root[data-theme="dark"] .ohang-summary,:root[data-theme="dark"] .card-box,:root[data-theme="dark"] .comp-card,:root[data-theme="dark"] .sj-tabs button:not(.on){background:rgba(45,36,64,.78)}

:root[data-theme="dark"] .comp-line.f .who{color:#f472b6}
:root[data-theme="dark"] .timeline-period{color:#f9a8d4}
</style>
</head>

{e:'📈',t:'투자',sub:'장기 투자 · 안전한 투자',he:['길게 보되, 가장 큰 가치가 먼저','단기 투자보다 장기 투자를 하며, 어느 정도 리스크는 감수하는 성향이에요. 하지만 투자로 얻는 가치보다 더 높은 가치가 있다면 투자는 하지 않아도 돼요. 그에게는 가장 큰 가치를 지키는 게 우선이에요.'],she:['안전하게, 천천히 불리기','안전한 투자를 지향해요. 리스크 때문에 인생이 불안해지는 걸 싫어하고, 더 적게 벌더라도 변동이 크지 않게 오랜 기간 서서히 재산을 늘리는 걸 추구해요.']},
{e:'🏡',t:'가정',sub:'아내가 1순위 · 행복한 가정',he:['아내가 가장 중요해','아내가 가장 중요해요. 그녀를 사랑했기에 결혼한 거라서요. 자녀가 생긴다면 자녀도 중요하지만, 그에게 가장 1순위는 아내가 될 거예요. 아내를 위해 뭐든 다 맞춰주고 해줄 거예요. 그래야 마음이 편하고 그렇게 하는 게 좋기 때문이에요. 가정을 지키는 게 그가 원하는 거예요.'],she:['행복한 가정, 자녀 양육에 집중','행복한 가정을 꾸리는 걸 원해요. 함께해서 더 좋을 수 있는 부부가 되길 바라요. 자녀를 가지길 바라고, 자녀가 원하는 걸 해주고 싶어해요. 출산을 하면 3년간은 일을 잠깐 멈추고 자녀 양육에 집중할 거예요. 그 기간은 자녀에게 가장 중요한 시간이라고 생각해요.']},
{e:'💰',t:'돈과 소비',sub:'소박한 지출 · 질 좋은 소비',he:['나에겐 소박하게, 소중한 사람에겐 넉넉히','돈을 많이 쓰지 않는 성향이에요. 돈 쓰는 데 크게 흥미가 없고, 비싼 차나 명품, 화려함과는 거리가 멀어요. 하지만 본인은 쓰지 않아도 좋아하는 사람에게 쓰는 돈은 아깝지 않아서, 연인이나 아내에게 필요한 게 있다면 언제든 사줄 수 있어요. 다만 너무 큰 지출로 가계 형편이 흔들려서는 안 된다고 생각해요.'],she:['실용적이지만 먹고 입는 건 좋은 걸로','사치와 과시를 하지 않고 굉장히 실용적인 성향이에요. 하지만 먹는 것과 입는 것만큼은 좋은 걸 하고 싶어해요. 지금도 양보다 질을 중시하고, 본인에게 맞다고 생각하면 잘 바꾸지 않고 같은 제품이나 브랜드를 계속 골라요.']},

D.aff=[
{e:'👀',t:'첫인상',sub:'처음 만났을 때',
 he:['최고의 첫인상','여성의 첫인상을 매우 좋게 봤어요. 키가 크고 참한 인상에 웃는 모습이 예뻤고, 단정하고 수수한 모습이 좋았어요. 대화가 즐겁고 잘 받아주며 배려심이 많은 모습에 반했어요. 처음에는 "OO님"이라는 극존칭을 쓰는 모습에 끌렸고, 이후에도 그녀의 귀여운 부분들을 계속 발견하게 됐어요.'],
 she:['믿음직한 사람','남성의 인격적인 성품과 신뢰할 수 있는 부분을 좋게 봤어요. 가치관이나 사주 등 마음에 걸리는 부분이 있어 미래가 조금 두렵지만, 그래도 호감이 크게 작용하고 있어요.']},
{e:'🌻',t:'이상형',sub:'닮고 싶은 모습',
 he:['참한 느낌의 여성','문채원, 한지민 같은 참한 느낌의 여성이 이상형이에요. 그리고 웃는 모습이 예쁜것도 추가 됐어요. 서로를 있는 그대로 봐주는 사람을 원해요.'],
 she:['이해심 많고 그릇 큰 사람','이해심이 많고 그릇이 큰 사람이 1순위 이상형이에요. 2순위로는 항상 아내만 바라보는 해바라기 같은 남성, 그리고 진돗개처럼 든든한 부분도 좋아요. 서로를 있는 그대로 봐주는 사람을 원해요.']},
{e:'💕',t:'연애',tf:1,sub:'지켜주는 사랑 · 안전한 마음',he:['시간이 갈수록 커지는 사랑','사랑이 시간이 지날수록 커지고, 상대의 감정에 영향을 많이 받아요. 이성을 쟁취하기보다 지켜주고 옆에 있고 싶어하며, 좋아하는 사람에게 뭔가 해주는 걸 좋아해요.'],she:['안전해야 열리는 마음','스스로 안전하다고 느껴야 마음이 열리고 상대를 받아줄 수 있어요. 남자가 자기만 바라보며 자신을 가장 사랑해 주길 바라고, 그것만 되면 다른 것들은 대부분 허용해 줄 수 있어요.'],tt:'그의 불안과 다짐',tip:'그녀는 그의 성격이 모질지 못하고 거절을 잘 못해서 그 점이 불안해요. 그래서 그는 결혼한다면 아내만 바라보겠다고 다짐하고, 아내가 처음이자 마지막 여자라는 서약을 공증까지 하려고 해요.'}];
D.mbti=[
{ov:1,e:'🐋',t:'우리 유형',sub:'INFP · ISFJ',
 he:['INFP · 마음이 깊은 고래','자기 안의 가치를 가장 소중히 여기고, 겉은 조용해도 속엔 오래 타는 열정이 있어요. 사람의 아픔에 함께 아파하지만 상처도 오래 남아 혼자 삭이는 시간이 길어져요.',['I 47','N 13','F 13','P 3']],
 she:['ISFJ · 다정한 코끼리','말하지 않아도 필요한 것을 먼저 알아채고 조용히 챙겨요. 기억력이 좋고 맡은 자리를 묵묵히 지키지만, 정작 자신이 지쳤다는 신호는 뒤늦게 알아차려요.',['I 47','S 19','F 1','J 15']],
 note:'사진을 누르면 크게 볼 수 있어요. MBTI는 선호 경향을 보는 도구예요. 그의 J·P(16:17)와 그녀의 T·F(15:15)는 사실상 동점이라 그 글자는 확정이라고 보기 어려워요. 출처: 100문항 MBTI 체크.'},
{e:'🌙',t:'에너지',sub:'I · I',he:['혼자서 깊이 충전','내향 I 26 : 외향 E 3. 사람 많은 자리 뒤에는 혼자만의 시간이 꼭 필요해요.'],she:['익숙한 곁에서 충전','내향 I 27 : 외향 E 4. 소란한 자리보다 익숙한 사람 곁이 편해요.'],gap:8},
{e:'🔍',t:'정보',sub:'N · S',he:['의미와 가능성을 봐요','직관 N 17 : 감각 S 11. 지금 일보다 그 일의 의미와 앞으로의 그림을 떠올려요.'],she:['사실과 경험을 믿어요','감각 S 20 : 직관 N 10. 지금 필요한 것과 이미 겪은 일을 바탕으로 판단해요.'],gap:85},
{e:'💭',t:'판단',sub:'F · F',he:['마음의 가치로 결정','감정 F 20 : 사고 T 14. 옳고 그름보다 마음에 맞는지를 먼저 따져요.'],she:['감정과 논리의 균형','감정 F 15 : 사고 T 15 동점. 상황에 따라 마음과 논리를 오가요.'],gap:25},
{e:'🗓️',t:'생활방식',sub:'P · J',he:['유연하게 흐르기','인식 P 17 : 판단 J 16, 거의 균형. 상황이 바뀌면 방향도 바꿔요.'],she:['계획적으로 정리','판단 J 19 : 인식 P 11. 정해진 순서와 준비가 마음을 편하게 해요.'],gap:40},
{e:'🕊️',t:'갈등과 화해',sub:'마음 다루기',he:['상처가 깊고 오래 가요','마음이 깊은 만큼 상처도 오래 남고, 혼자 삭이는 시간이 길어져요.'],she:['먼저 돌보고 늦게 말해요','남을 먼저 챙기다 자신이 지쳤다는 신호를 뒤늦게 알아차려요.'],gap:40}];

const LS=[['⏳','함께하는 시간',10,7],['💬','인정하는 말',9,5],['🛠️','봉사',7,12],['🤗','스킨십',3,2],['🎁','선물',1,4]];
D.love=[
{lv:1,e:'💌',t:'우리 순위',sub:'사랑의 언어 점수',
 note:'점수는 한 사람이 30점을 나눠 가진 상대적인 값이에요. 그래서 그의 10점과 그녀의 12점을 세기로 직접 비교하긴 어려워요. 또 사랑의 언어가 일치할수록 관계 만족이 높다는 근거는 연구에서 약한 편이라, 서로를 알아가는 대화의 도구로 보는 게 맞아요.'},
{e:'⏳',t:'함께하는 시간',sub:'그 1위 · 그녀 2위',sc:[10,7],he:['10점 · 1위','TV와 일을 멈추고 온전히 집중해 주는 시간에 사랑을 가장 크게 느껴요.'],she:['7점 · 2위','1:1로 집중해 주는 시간이 두 번째로 중요해요. 딴짓하며 듣는 건 상처가 돼요.'],gap:25},
{e:'💬',t:'인정하는 말',sub:'그 2위 · 그녀 3위',sc:[9,5],he:['9점 · 2위','"사랑해, 고마워, 잘했어"에서 힘을 얻고, 무심한 말에는 크게 아파요.'],she:['5점 · 3위','말도 좋아하지만 행동만큼 큰 비중은 아니에요.'],gap:33},
{e:'🛠️',t:'봉사',sub:'그 3위 · 그녀 1위',sc:[7,12],he:['7점 · 3위','행동으로 도와주는 것도 사랑으로 느끼지만, 말과 시간 다음이에요.'],she:['12점 · 1위','"그거 내가 할게"가 가장 큰 사랑이에요. 시켜야 하는 일, 약속 어기기, 생색내기는 상처예요.'],gap:42},
{e:'🤗',t:'스킨십',sub:'그 4위 · 그녀 5위',sc:[3,2],he:['3점 · 4위','손잡기와 토닥임은 좋지만 중심 언어는 아니에요.'],she:['2점 · 5위','비중은 낮아요. 서로 신뢰하고 합의한 선에서 짧은 포옹이면 충분해요.'],gap:8},
{e:'🎁',t:'선물',sub:'그 5위 · 그녀 4위',sc:[1,4],he:['1점 · 5위','선물이라는 형식에는 거의 의미를 두지 않아요.'],she:['4점 · 4위','큰 비중은 아니지만, 기념일을 잊거나 성의 없는 선물은 상처가 될 수 있어요.'],gap:25}];
function lvBody(t,A){const n=D.names;return `<div class="rank"><div class="lg"><span class="bh">${n.he}</span><span class="bw">${n.she}</span></div>${LS.map(l=>`<div class="rw"><b>${l[0]} ${l[1]}</b><span class="bh" style="width:${l[2]/12*100}%">${l[2]}</span><span class="bw" style="width:${l[3]/12*100}%">${l[3]}</span></div>`).join('')}</div>${A}`}

  ['p1','p2','p3','p4','p5'].forEach(p=>{
    const el=document.getElementById('sj-'+p);
    if(el) el.classList.toggle('on',sp===p);
  });
  if(scroll){
    $('#saju-all').scrollTop=0;
  }
}

};

const AN={"v": {"투자": {"c": "둘 다 단기 수익을 쫓지 않고, 시간을 들여 불리는 쪽이에요.", "d": "변동을 받아들이는 폭이 달라요. 그는 어느 정도 손실 가능성을 감수하고, 그녀는 변동 자체가 불안의 원인이에요. 또 그는 더 큰 가치가 걸려 있으면 투자를 접을 수 있다는 기준도 갖고 있어요.", "g": "평소에는 맞지만 손실이 났을 때 가장 크게 어긋날 가능성이 커요. 공동 자금은 변동이 작은 쪽(그녀 기준)을 중심에 두고, 그가 감수하고 싶은 부분은 잃어도 생활이 흔들리지 않는 금액으로 한도를 정해 따로 운용해요. 그 한도와 손실이 얼마가 되면 멈출지는 투자 전에 숫자로 합의해 두세요."}, "돈과 소비": {"c": "둘 다 사치와 과시에는 관심이 없고 실용을 중시해요. 그는 소중한 사람이 원하는 건 언제든 사줄 수 있고, 그녀의 소비는 과시가 아니라 질 중심이라 요구하는 수준도 과하지 않아요.", "d": "쓰는 방향이 달라요. 그는 본인에게는 거의 쓰지 않고, 그녀는 먹는 것과 입는 것만큼은 좋은 걸 직접 고르고 싶어해요. 하지만 이 차이가 충돌로 이어질 근거는 약해요. 그녀의 취향이 그가 기꺼이 쓰는 범위 안에 들어 있기 때문이에요. 그의 유일한 단서는 가계 형편이 흔들리지 않는 선이에요.", "g": "이 구름은 두 사람 사이에서 마찰 가능성이 낮은 편이에요. 비싼 음식이나 옷 자체는 문제가 되지 않아요. 가계에 부담이 될 만큼 큰 지출이 생길 때만 사기 전에 같이 한 번 보기로 해 두면 충분해요."}, "가정": {"c": "둘 다 행복한 가정을 꾸리고 싶어 하고, 자녀를 소중히 여길 거예요. 가정을 지키는 가치를 공유하고 있어요.", "d": "그는 아내를 가장 1순위로 생각하고, 아내를 위해 모든 것을 맞춰주려는 성향이 강해요. 그녀는 자녀가 생기면 3년간 일을 멈추고 자녀 양육에 집중하려는 의향이 있어요. 하지만 그는 그녀를 가장 중요하게 생각하고 존중해서, 자녀 문제도 전적으로 그녀를 따를 가능성이 커요.", "g": "그가 아내를 소중히 여기고 존중하는 마음이 자연스럽게 자녀 양육 계획도 포용하게 될 거예요. 그녀의 3년간 양육 집중 계획에 대해 미리 이야기 나누면서, 그가 그 기간 동안 어떻게 아내를 돕고 가정을 지킬 수 있을지 함께 생각해 두면 좋아요."}}, "p": {"첫인상": {"c": "둘 다 외모나 조건보다 상대의 성품과 태도에 끌렸어요. 호감은 양쪽 모두 분명해요.", "d": "그에게는 불안 요소가 거의 보이지 않는 반면, 그녀에게는 호감과 함께 가치관·사주 같은 걱정이 따라와요. 호감은 같아도 미래에 대한 불안은 그녀 쪽에만 적혀 있어요.", "g": "그녀의 두려움은 막연한 불안이 아니라 확인할 수 있는 항목(가치관, 사주)에 붙어 있어요. 안심시키는 말보다 걱정되는 항목을 하나씩 꺼내 이야기하고, 확인된 만큼 줄여 가는 쪽이 효과적이에요. 이 정원의 가치관 구름들이 그 대화의 시작점이 돼요."}, "이상형": {"c": "둘 다 조건보다 상대의 태도를 이상형으로 꼽았어요. 이 정원의 내용으로 보면 서로가 상대의 이상형에 이미 가까워요. 그가 말한 참하고 웃는 인상은 그의 첫인상 평가와 같고, 그녀가 바라는 아내만 바라보는 남자는 그의 다짐과 같아요.", "d": "그의 기준은 인상과 분위기라 첫 만남에서 확인됐어요. 그녀의 기준은 행동이 계속되는 것이라 시간이 지나야 확인돼요.", "g": "그녀의 기준은 말이 아니라 행동의 일관성으로만 채워져요. 그는 다짐한 태도를 꾸준히 보여 주는 게 핵심이고, 그녀는 이미 맞는 부분을 말로 한 번씩 전해 주면 좋아요. 인정하는 말은 그의 2위 사랑의 언어예요."}, "연애": {"c": "둘 다 한 사람에게 깊이 가는 연애를 원하고, 안정된 관계를 중요하게 여겨요.", "d": "그는 상대 감정에 영향을 많이 받고 먼저 해 주면서 다가가요. 그녀는 안전하다고 느껴져야 마음이 열려요. 그리고 그녀가 가장 바라는 자기만 바라봐 주기는, 그녀가 불안해하는 그의 거절을 못하는 성격과 직접 닿아 있어요.", "g": "이 구름의 핵심은 그의 약점이 곧 그녀의 안전 조건과 겹친다는 점이에요. 공증 같은 큰 약속과 함께, 다른 이성과의 거리 기준 같은 일상의 작은 규칙을 그가 먼저 구체적으로 말해 주면 안전감이 훨씬 빨리 쌓여요."}}, "m": {"우리 유형": {"c": "둘 다 내향(I 47 동점)이고, 감정을 안으로 삼키는 쪽이에요. 조용한 환경이 잘 맞아요.", "d": "그는 의미와 가능성을 보고 유연하게 움직이고, 그녀는 사실과 경험에 기대고 계획을 선호해요. 다만 그의 J·P와 그녀의 T·F는 동점 수준이라 확정할 수 없어요.", "g": "둘 다 서운함을 먼저 꺼내지 않는 게 가장 큰 위험이에요. 확실한 차이인 N·S는 역할로 나누고(그는 큰 그림, 그녀는 실행 단계), 나머지는 정해진 결론이 아니라 대화의 출발점으로만 쓰세요."}, "에너지": {"c": "둘 다 내향이라 조용한 시간과 집 데이트를 편하게 느껴요(I 26·27).", "d": "충전 방식이 달라요. 그는 혼자서, 그녀는 익숙한 사람 곁에서 충전해요. 그가 혼자 있고 싶은 시간을 그녀가 거리 두기로 읽을 수 있어요.", "g": "혼자 충전이 필요할 땐 그가 “몇 시간 쉬고 연락할게”처럼 기간을 붙여 말해요. 둘 다 내향이라 만남이 줄기 쉬우니 약속은 번갈아 먼저 제안해요."}, "정보": {"c": "뚜렷한 공통점은 없어요. 이 축이 두 사람 사이에서 가장 크게 다른 항목이에요(차이 85).", "d": "그는 일의 의미와 앞으로의 그림을 보고, 그녀는 지금 필요한 것과 이미 겪은 경험을 봐요. 같은 사안을 그는 미래로, 그녀는 현재와 과거로 봐요.", "g": "투자·가계 같은 큰 결정에서 가장 자주 어긋날 축이에요. 그가 그림을 말하면 그녀가 “그럼 이번 달에 뭘 해야 해?”로 쪼개 주고, 그녀가 경험을 근거로 말하면 그는 의미로 반박하지 않고 사실부터 들어요. 정보의 종류가 다른 것이지 한쪽이 틀린 게 아니에요."}, "판단": {"c": "둘 다 판단에 마음을 많이 써요(F 20, F 15).", "d": "그는 마음에 맞는지를 먼저 따지고, 그녀는 감정과 논리가 동점이라 상황에 따라 달라져요. 그녀가 논리 모드일 때 그는 자기 마음을 안 봐 준다고 느낄 수 있어요.", "g": "의견이 갈릴 땐 사실 한 줄, 마음 한 줄을 번갈아 말해요. 그녀는 논리를 말하기 전에 마음 한 줄을 먼저 붙이면 오해가 줄어요. 그녀의 F·T는 동점이라 이 구분 자체는 확정이 아니에요."}, "생활방식": {"c": "그의 P·J가 거의 균형(17:16)이라 극단적으로 부딪히는 조합은 아니에요.", "d": "그녀는 정해진 순서와 준비가 마음을 편하게 하고, 그는 상황에 따라 방향을 바꿔요. 갑작스러운 변경이 그녀에게 더 큰 스트레스일 수 있어요.", "g": "큰 틀은 그녀가 짜고 빈칸은 그가 여유로 채워요. 그가 일정을 바꿀 땐 가능하면 전날까지 알리는 규칙을 두세요."}, "갈등과 화해": {"c": "둘 다 서운함을 직접 꺼내기보다 안으로 삼켜요. 대처 방식이 비슷해서 갈등이 겉으로 잘 드러나지 않아요.", "d": "침묵의 이유가 달라요. 그의 침묵은 깊은 상처를 삭이는 시간이고, 그녀의 침묵은 자기가 지쳤다는 걸 늦게 알아차려서 생겨요.", "g": "침묵이 길어지면 이유를 캐묻기보다 “상처야, 지쳤어?”처럼 고르는 질문을 해요. 서운함은 하루 안에 한 줄로 먼저 말하고, 주 1회 마음 점검을 정해 두세요."}}, "l": {"우리 순위": {"c": "함께하는 시간은 둘 다 상위권(그 1위·그녀 2위)이고, 스킨십은 둘 다 낮아서(3·2) 충돌이 적어요.", "d": "그는 말(인정 2위)로, 그녀는 행동(봉사 1위)으로 사랑을 주고받아요. 각자 자기 언어로만 표현하면 상대에게 덜 닿아요. 가장 큰 차이는 봉사예요.", "g": "함께하는 시간을 안전한 기본값으로 두고, 그 시간에 그는 부탁받기 전에 행동 하나, 그녀는 한 일에 말 한마디를 서로의 언어로 보태요. 점수는 상대값이라 확정이 아닌 방향으로만 읽으세요."}, "함께하는 시간": {"c": "둘 다 1:1로 온전히 집중하는 시간을 중요하게 여겨요.", "d": "그에게는 가장 큰 언어(10점)이고 그녀에게는 두 번째(7점)라 중요도는 그가 더 높아요. 시간이 부족하면 그가 먼저 서운해지기 쉬워요. 그녀는 딴짓하며 듣는 모습에 상처받아요.", "g": "주 1회 휴대폰을 멀리 두는 한 시간을 정하고, 그 시간에 그녀가 원하는 행동 하나를 부탁받기 전에 곁들이세요. 그의 1위와 그녀의 1위가 한 번에 채워져요."}, "인정하는 말": {"c": "둘 다 따뜻한 말을 사랑의 표현으로 받아들여요.", "d": "그에게는 2위(9점)라 크게 작용하고, 그녀에게는 3위(5점)라 행동보다 비중이 작아요. 그녀가 말을 아끼는 건 무심함이 아니라 행동으로 표현하는 것일 수 있는데, 그는 이걸 불안하게 읽을 수 있어요.", "g": "그녀는 해 준 일에 그날 안에 한마디를 붙이고, 그는 말이 없는 그녀의 행동을 사랑의 표현으로 번역해서 받아들이는 연습을 해요."}, "봉사": {"c": "둘 다 행동으로 도와주는 것을 사랑의 표현으로 봐요(7점, 12점).", "d": "다섯 항목 중 점수 차가 가장 커요(5점). 그녀에게는 1위인데 그는 3위라 이 언어를 자연스럽게 떠올리지 못해요. 시켜야 하는 일, 약속을 어기는 일, 생색내기가 그녀에게는 큰 상처예요.", "g": "그녀에게 가장 효과가 큰 항목이에요. 그녀가 원하는 도움을 목록으로 한 번 물어 두고, 부탁받기 전에 생색 없이 하나씩 해 주세요. 작은 약속이라도 지키는 게 핵심이에요."}, "스킨십": {"c": "둘 다 낮은 편(3점, 2점)이라 한쪽만 원해서 생기는 충돌이 적어요.", "d": "점수 차는 1점이라 거의 없어요. 다만 낮은 점수는 필요 없다는 뜻이 아니라 중심 언어가 아니라는 뜻이에요.", "g": "서로 신뢰하고 합의한 선에서 짧은 포옹 정도를 기본으로 두고, 그 선은 짐작하지 말고 말로 한 번 확인해 두세요."}, "선물": {"c": "둘 다 선물은 중심 언어가 아니에요(1점, 4점).", "d": "그는 선물에 거의 의미를 두지 않아서, 그녀가 기념일과 성의를 중요하게 보는 걸 놓치기 쉬워요. 점수가 낮아도 상처로 이어질 수 있는 비대칭이에요.", "g": "그는 소중한 사람에게 쓰는 돈은 아깝지 않다고 했으니, 문제는 비용이 아니라 기억과 성의예요. 기념일은 알림을 걸어 두고, 그녀가 흘린 말을 메모해 두었다가 작은 선물로 돌려주세요."}}, "a": {"우리 유형": {"c": "둘 다 관계를 중요하게 여기고 가까워지길 원해요.", "d": "그는 거절 가능성을 먼저 떠올리며 확인을 구하고, 그녀는 거리낌 없이 가까워지고 필요하면 도움도 청해요. 안정형이 불안형의 안전 기지가 되기 쉽지만, 확인이 반복되면 그녀에게 부담이 되는 순환이 생길 수 있어요.", "g": "확인이 필요할 땐 그가 추궁이 아니라 요청으로 말하고, 그녀는 짧고 일관된 답으로 받아 주세요. 행동 표현이 큰 그녀가 그에게는 말로도 한 번 확인해 주는 게 중요해요. 간이 검사 결과이고 고정된 유형이 아니에요."}, "친밀감": {"c": "둘 다 가까운 관계를 원해요.", "d": "같은 친밀함인데 그에게는 불안이 함께 따라오고 그녀에게는 편안함이 따라와요. 그래서 그녀가 편하게 한 행동이 그에게는 거리감으로 읽힐 수 있어요.", "g": "그가 불안해 보일 때 “나 여기 있어”를 짧게 말해 주고, 그는 추궁 대신 느낌으로 말해요."}, "반응 민감도": {"c": "둘 다 상대의 반응을 전혀 안 보는 쪽은 아니에요.", "d": "그는 반응과 태도에 민감하고 그녀는 적당히 신경 써요. 그녀에게는 사소한 답 지연이 그에게는 신호로 읽힐 수 있어요.", "g": "바쁠 때는 “지금 바빠, 이따 연락할게”를 먼저 알려 주고, 그는 해석하기 전에 먼저 물어보세요."}, "감정 표현": {"c": "둘 다 표현하고 싶지만 망설여요. 애착 항목 중 가장 비슷한 축이에요(차이 15). 오해1의 원인과도 맞닿아 있어요.", "d": "차이는 작아요. 다만 망설이는 이유는 다를 수 있는데, 이 정원의 내용만으로는 확인되지 않아요.", "g": "둘 다 망설이면 둘 다 말하지 않아 침묵이 쌓여요. 짧은 메시지나 메모처럼 부담이 적은 방식으로 시작하고, 먼저 말하는 사람을 번갈아 정해요."}, "도움 요청": {"c": "뚜렷한 공통점이 없어요. 가장 크게 다른 애착 항목이에요(차이 70).", "d": "그녀는 필요하면 쉽게 부탁하고, 그는 거절이 두려워 부탁 자체를 망설여요. 그녀의 “지금은 어려워”가 그에게는 자신에 대한 거절로 읽힐 수 있어요.", "g": "그녀는 거절할 때 사정과 대안을 함께 말해요. 그는 작은 부탁부터 해 보면서 거절이 관계의 거절이 아니라는 경험을 쌓아요."}, "균형 잡기": {"c": "둘 다 고정된 유형이 아니라 관계에 따라 달라질 수 있어요.", "d": "그는 거절 가능성을 먼저 떠올리고, 그녀는 불안과 안정 사이에서 균형을 찾아가요. 출발점이 달라서 같은 일에도 반응의 크기가 달라요.", "g": "주 1회 “요즘 우리 어때?”를 점검해서 불안이 쌓이기 전에 풀어요. 그가 안정적이라고 느끼는 경험이 쌓이면 이 차이는 줄어들 수 있어요."}}, "x": {"오해1": {"c": "둘 다 표현이 서툴러서 상대 마음을 읽지 못한 쪽이에요. 그리고 좋아하는 마음은 양쪽에 모두 있어요.", "d": "두려움의 모양이 달라요. 그는 거절당할 가능성이 두렵고(불안형), 그녀는 안전이 확인돼야 마음이 열려요. 같은 침묵이 그에게는 거절로, 그녀에게는 확인 부족으로 읽혀요.", "g": "마음을 짐작하게 두지 말고, 짧은 메시지로 좋아하는 마음을 한 줄씩 말해요. 그리고 각자 어떤 상황에서 두려운지를 상대에게 직접 알려 주세요. 감정 표현 구름의 번갈아 먼저 말하기를 그대로 쓸 수 있어요."}, "오해2": {"c": "둘 다 사랑이 크고 소중하다는 마음을 서로 확실히 주고받고 싶어해요.", "d": "그는 예시와 비유로 설명하고, 그녀는 전달된 말을 그대로 받아들여요. 이건 MBTI 정보 축(그는 의미·가능성, 그녀는 사실·경험)의 차이와 같은 방향이에요. 같은 문장을 그는 비유로, 그녀는 사실로 받아요.", "g": "그는 예시나 중립적인 설명 대신 “처음부터 많이 좋아했고 지금도 커지고 있어”처럼 직접 문장으로 말해요. 그녀는 뜻이 헷갈리는 말은 바로 “그 말은 이런 뜻이야?” 하고 되물어 주세요."}}};
function anBody(a,x){return a?`<div class="an"><b>🔍 두 사람 분석</b><dl><dt>🤝 공통점</dt><dd>${a.c}</dd><dt class="dd2">🧩 다른 점</dt><dd>${a.d}</dd><dt class="dd3">🧭 이렇게 하면 좋아요</dt><dd>${a.g}</dd></dl><p class="anf">※ 이 정원에 적힌 두 사람의 답변과 검사 결과만 근거로 한 해석이에요.</p>${x?`<p class="anf anx">${x}</p>`:''}</div>`:''}

 she:['기다리는 건 싫어, 딱 맞게','기다리는 걸 싫어해서 항상 딱 맞게 움직이는 편이에요. 늦어서 문제 생긴 적은 없고, 늦었다 싶으면 행동을 빨리해서 그 스릴을 즐겨요.']},

/* ===== 메모리 탭 카메라 애니메이션 ===== */
function playCameraShutterSound(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime;
    // 셔터 기계음 (거울 젖힘)
    const o1=ac.createOscillator();const g1=ac.createGain();
    o1.type='sine';o1.frequency.setValueAtTime(850,t0);
    o1.frequency.exponentialRampToValueAtTime(140,t0+0.04);
    g1.gain.setValueAtTime(0.7,t0);
    g1.gain.exponentialRampToValueAtTime(0.01,t0+0.04);
    o1.connect(g1);g1.connect(ac.destination);
    o1.start(t0);o1.stop(t0+0.04);

    // 셔터막 노이즈 ('찰')
    const bSize=Math.floor(ac.sampleRate*0.07);
    const buf=ac.createBuffer(1,bSize,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bSize;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.018));
    const noise=ac.createBufferSource();noise.buffer=buf;
    const gN=ac.createGain();gN.gain.value=0.55;
    noise.connect(gN);gN.connect(ac.destination);
    noise.start(t0+0.02);

    // 셔터막 닫힘 ('칵!')
    const o2=ac.createOscillator();const g2=ac.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(1100,t0+0.065);
    o2.frequency.exponentialRampToValueAtTime(90,t0+0.12);
    g2.gain.setValueAtTime(0.85,t0+0.065);
    g2.gain.exponentialRampToValueAtTime(0.01,t0+0.12);
    o2.connect(g2);g2.connect(ac.destination);
    o2.start(t0+0.065);o2.stop(t0+0.12);

    setTimeout(()=>{try{ac.close()}catch(e){}},300);
  }catch(e){}
}

let camBusy=false;
function showCamAnim(){
  if(camBusy)return;
  camBusy=true;
  // 탭 버튼 상태 업데이트
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.k==='y'));
  const overlay=$('#cam-overlay');
  const flash=$('#cam-flash');
  overlay.classList.add('on');

  // 남자가 사진 찍고 둘이 미소 짓는 장면 -> 0.65초 후 찰칵!
  setTimeout(()=>{
    playCameraShutterSound();
    flash.classList.remove('pop');
    void flash.offsetWidth;
    flash.classList.add('pop'); // 플래시 섬광

    // 플래시가 번쩍이는 순간 오버레이 닫히고 필름이 부드럽게 등장
    setTimeout(()=>{
      overlay.classList.remove('on');
      build('y'); // 필름 화면 렌더링 & filmSlideIn 애니메이션으로 부드럽게 펼쳐짐
      camBusy=false;
    },180);
  },650);
}

function dive(i,b){
  const t=SET[cur][i],n=D.names,A=anBody((AN[cur]||{})[t.t],t.note||''),T=t.tip?`<div class="tip"><b>💡 ${t.tt||(t.ov?'함께 알아둘 점':'함께 맞추는 방법')}</b><p>${t.tip}</p></div>`:'';
  if(b){const r=b.getBoundingClientRect();stage.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2}px`}
  const lv=t.gap<35?'꽤 비슷해요':t.gap<65?'조금 달라요':'많이 달라요';
  const card=k=>!t[k]?`<div class="card"><div class="av">${F[k]}</div><h3>${n[k]}</h3><strong>아직 비어 있어요</strong><p>생년월일과 태어난 시간을 알면 채울 수 있어요.</p></div>`:`<div class="card"><div class="av happy">${F[k]}</div><h3>${n[k]}</h3><strong>${t[k][0]}</strong><p>${t[k][1]}</p>${t.sc?`<div class="mb"><i style="width:${t.sc[k==='he'?0:1]/12*100}%"></i></div>`:''}${t.ov?`<div class="sc">${t[k][2].map(x=>`<i>${x}</i>`).join('')}</div><img class="shot" data-k="${k}" src="${(t.imgs||IMG)[k]}" alt="${n[k]}의 MBTI 결과 화면">`:''}</div>`;
  let body=t.empty?`<div class="tip"><b>✏️ 아직 비어 있어요</b><p>이 주제는 아직 작성하지 않았어요. 작성되면 여기에 채워질 거예요.</p></div>`:t.mis?misBody(t)+A:t.lv?lvBody(t,A):(t.ov||t.gap==null?'':`<div class="meter">차이 ${t.gap} · ${lv}<div class="bar"><i style="left:${t.gap}%"></i></div></div>`)+`<div class="cards">${card('he')}${card('she')}</div>${t.tf?T+A:A+T}`;
  if(t.note&&!A)body+=`<p class="note">${t.note}</p>`;
  detail.innerHTML=`<div class="dw"><button class="back">← 구름으로</button><div class="dh"><span>${t.e}</span><h2>${t.t}</h2><p>${t.sub}</p></div>${body}</div>`;
  detail.querySelectorAll('.shot').forEach(im=>im.onclick=()=>{$('#lbi').src=im.src;$('#lb').classList.add('on')});
  detail.scrollTop=0;
  if(!detail.classList.contains('on')){stage.classList.add('dive');setTimeout(()=>detail.classList.add('on'),450)}
  detail.querySelector('.back').onclick=()=>{detail.classList.remove('on');stage.classList.remove('dive')};
}
